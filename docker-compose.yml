services:
  etcd:
    image: bitnami/etcd:3.5
    environment:
      - ALLOW_NONE_AUTHENTICATION=yes
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_ADVERTISE_CLIENT_URLS=http://0.0.0.0:2379
    ports:
      - "2379:2379"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2379/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - sliceDB-network

  controller1:
    build: .
    command: ["./controller", "--id", "controller1", "--addr", ":8080", "--etcd", "etcd:2379"]
    depends_on:
      etcd:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: always
    ports:
      - "8080:8080"
    networks:
      - sliceDB-network

  controller2:
    build: .
    command: ["./controller", "--id", "controller2", "--addr", ":8081", "--etcd", "etcd:2379"]
    depends_on:
      etcd:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: always
    ports:
      - "8081:8081"
    networks:
      - sliceDB-network

  node1:
    build: .
    command: ["./node", "--id", "node1", "--addr", ":8090", "--etcd", "etcd:2379"]
    depends_on:
      etcd:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: always
    ports:
      - "8090:8090"
    networks:
      - sliceDB-network

  node2:
    build: .
    command: ["./node", "--id", "node2", "--addr", ":8091", "--etcd", "etcd:2379"]
    depends_on:
      etcd:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8091/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: always
    ports:
      - "8091:8091"
    networks:
      - sliceDB-network

  node3:
    build: .
    command: ["./node", "--id", "node3", "--addr", ":8092", "--etcd", "etcd:2379"]
    depends_on:
      etcd:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8092/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: always
    ports:
      - "8092:8092"
    networks:
      - sliceDB-network

networks:
  sliceDB-network:
    driver: bridge
